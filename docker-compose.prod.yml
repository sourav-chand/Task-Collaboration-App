version: "3.8"

services:
  # MongoDB service
  mongodb:
    image: mongo:latest
    container_name: task-collab-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

  # Server service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: task-collab-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://admin:password@mongodb:27017/taskcollab?authSource=admin
      - JWT_SECRET=your_jwt_secret_key_here
      - PORT=5000
    depends_on:
      - mongodb
    volumes:
      - mongodb_data:/data/db

  # Client service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: task-collab-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

# Production volumes
volumes:
  mongodb_data:
