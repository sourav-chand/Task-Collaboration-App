version: "3.8"

services:
  # MongoDB service
  mongodb:
    image: mongo:latest
    container_name: task-collab-mongodb-dev
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_dev:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

  # Server service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: task-collab-server-dev
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://admin:password@mongodb:27017/taskcollab?authSource=admin
      - JWT_SECRET=your_jwt_secret_key_here
      - PORT=5000
    depends_on:
      - mongodb
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev

  # Client service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: task-collab-client-dev
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000
    command: npm run dev
    depends_on:
      - server

# Development volumes
volumes:
  mongodb_data_dev:
